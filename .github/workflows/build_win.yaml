name: Build for Windows

concurrency:
    group: foobar2 #must be different from the linux build
    cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [net_masterserver]

jobs:
  build_it_on_windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v3

      - name: Install deps
        uses: msys2/setup-msys2@v2
        with:
        # path to .dlls is D:\msys64\mingw64\bin then
           location: D:\
           update: true
           install: >-
              base-devel
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-make
              mingw-w64-x86_64-ntldd-git
      - name: install deps (2)
        run: pacman --noconfirm -S --needed --overwrite '*' mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-SDL2_mixer mingw-w64-x86_64-SDL2_ttf mingw-w64-x86_64-glew mingw-w64-x86_64-mesa mingw-w64-x86_64-enet mingw-w64-x86_64-curl mingw-w64-x86_64-opus
      - name: install liblua 5.4 (instead of 5.3)
        run: pacman --noconfirm -U https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-lua-5.4.3-2-any.pkg.tar.zst

      - name: list DLLs (debug)
        run: pacman -Ql mingw-w64-x86_64-opus mingw-w64-x86_64-curl mingw-w64-x86_64-enet mingw-w64-x86_64-mesa mingw-w64-x86_64-glew mingw-w64-x86_64-SDL2_ttf
                       mingw-w64-x86_64-SDL2_mixer mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-SDL2
                       mingw-w64-x86_64-lua
                       mingw-w64-x86_64-brotli mingw-w64-x86_64-libidn2 mingw-w64-x86_64-libiconv mingw-w64-x86_64-libunistring mingw-w64-x86_64-libpsl mingw-w64-x86_64-zlib mingw-w64-x86_64-zstd mingw-w64-x86_64-openssl mingw-w64-x86_64-gcc-libs
                       mingw-w64-x86_64-libwinpthread  
                       mingw-w64-x86_64-freetype mingw-w64-x86_64-bzip2 mingw-w64-x86_64-libpng 
                       mingw-w64-x86_64-libogg mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libmodplug | grep /mingw64/bin/.*.dll
      - name: list DLLs (debug)
        run: ls -la /mingw64/bin
      - name: Make build directory
        run: mkdir build && mkdir build-headless && ls -la
      - name: ldd1 (debug)
        working-directory: ./build
        run: ldd --help
      - name: Generate build files (gl4)
        working-directory: ./build
        run: pwd && cmake -G "MinGW Makefiles" -D_WIN32=true -DD6R_RENDERER=gl4 ..

      - name: debug print (CMakeCache.txt)
        working-directory: ./build
        run: cat ./CMakeCache.txt

      - name: debug print (link.txt)
        working-directory: ./build
        run: cat ./CmakeFiles/duel6unity.dir/link.txt

      - name: Make duel6unity (unity build)
        working-directory: ./build
        run: mingw32-make -j 2 duel6unity

      - name: Generate build files (headless)
        working-directory: ./build-headless
        run: cmake -G "MinGW Makefiles" -D_WIN32=true -DD6R_RENDERER=headless ..

      - name: Make duel6 (unity build headless)
        working-directory: ./build-headless
        run: mingw32-make -j 2 duel6unity && cp ./duel6unity.exe ./duel6headless.exe
#
#      - name: Make duel6 (normal build)
#        working-directory: ./build
#        run: make -j 2 duel6r
#
      - name: Make masterserver
        working-directory: ./build
        run: mingw32-make -j 2 duel6r-masterserver

      - name: ntldd (debug)
        working-directory: ./build
        run: ntldd -R duel6unity.exe

      - name: ldd (debug)
        working-directory: ./build
        run: ldd duel6unity.exe

      - name: zip
        working-directory: ./build
        run: >
            tar -czh --verbose --file=duel-build_win.tar.gz duel6unity.exe duel6r-masterserver.exe \
             -C ../resources . \
             -C ../build-headless duel6headless.exe \
             -C /mingw64/bin \
                glew32.dll \
                libbrotlicommon.dll \
                libbrotlidec.dll \
                libbrotlienc.dll \
                libbz2-1.dll \
                libcrypto-1_1-x64.dll \
                libcurl-4.dll \
                libdeflate.dll \
                libenet-7.dll \
                libFLAC.dll \
                libFLAC++.dll \
                libfreetype-6.dll \
                libglib-2.0-0.dll \
                libgraphite2.dll \
                libharfbuzz-0.dll \
                libhwy.dll \
                libiconv-2.dll \
                libidn2-0.dll \
                libintl-8.dll \
                libjbig-0.dll \
                libjpeg-8.dll \
                libjxl.dll \
                liblcms2-2.dll \
                libLerc.dll \
                libmodplug-1.dll \
                libmpg123-0.dll \
                libnghttp2-14.dll \
                libogg-0.dll \
                libopus-0.dll \
                libopusfile-0.dll \
                libpcre2-8-0.dll \
                libpng16-16.dll \
                libpsl-5.dll \
                libssh2-1.dll \
                libssl-1_1-x64.dll \
                libssp-0.dll \
                libtiff-5.dll \
                libtiffxx-5.dll \
                libturbojpeg.dll \
                libunistring-2.dll \
                libvorbis-0.dll \
                libvorbisenc-2.dll \
                libvorbisfile-3.dll \
                libwebp-7.dll \
                libwebpdecoder-3.dll \
                libwebpdemux-2.dll \
                libwebpmux-3.dll \
                libwinpthread-1.dll \
                liblzma-5.dll \
                libzstd.dll \
                lua54.dll \
                SDL2.dll \
                SDL2_image.dll \
                SDL2_mixer.dll \
                SDL2_ttf.dll \
                zlib1.dll \
                libgcc_s_seh-1.dll \
                libstdc++-6.dll \

      - uses: actions/upload-artifact@v3
        with:
          name: duel-build
          path: build/duel-build_win.tar.gz
